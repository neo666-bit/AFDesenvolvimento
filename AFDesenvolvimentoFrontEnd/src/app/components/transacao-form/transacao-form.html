<div class="form-card">
  <h2>{{ form._id ? 'Editar Movimentação' : 'Nova Movimentação' }}</h2>

  <form (ngSubmit)="salvar()" class="form-grid">
    <div class="campo">
      <label>Descrição</label>
      <input
        type="text"
        name="descricao"
        [(ngModel)]="form.descricao"
        placeholder="Ex: Supermercado, Salário..."
        required
      />
    </div>

    <div class="campo">
      <label>Valor (R$)</label>
      <input
        type="number"
        name="valor"
        [(ngModel)]="form.valor"
        step="0.01"
        min="0.01"
        required
      />
    </div>

    <div class="campo">
      <label>Tipo</label>
      <select name="tipo" [(ngModel)]="form.tipo">
        <option value="receita">Receita (Entrada)</option>
        <option value="despesa">Despesa (Saída)</option>
      </select>
    </div>

    <div class="campo">
      <label>Categoria</label>
      <select name="categoria" [(ngModel)]="form.categoria">
        @for (cat of categorias; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <div class="campo">
      <label>Data</label>
      <input
        type="date"
        name="data"
        [(ngModel)]="form.data"
        required
      />
    </div>

    <div class="acoes">
      <button type="submit" class="btn-salvar">
        {{ form._id ? 'Atualizar' : 'Adicionar' }}
      </button>

      @if (form._id) {
        <button type="button" class="btn-cancelar" (click)="limpar()">
          Cancelar
        </button>
      }
    </div>
  </form>
</div>
